spring:
  datasource:
    url: jdbc:postgresql://preferencedb:5432/job_portal_preference
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 5005

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://discovery:8761/eureka/
  instance:
    prefer-ip-address: true